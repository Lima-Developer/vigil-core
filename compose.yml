services:
  postgres:
    image: postgres:16.4
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: vigil_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synthetic-demo-admin
    volumes:
      - ./docker/demo/init.sql:/docker-entrypoint-initdb.d/10-vigil-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vigil_lab"]
      interval: 3s
      timeout: 3s
      retries: 20

  vigil:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local,demo
      SERVER_ADDRESS: 0.0.0.0
      VIGIL_DATABASE_PATH: /var/lib/vigil/vigil.db
      VIGIL_STORAGE_MIN_FREE_BYTES: 1048576
      VIGIL_TARGET_NAME: synthetic-postgres
      VIGIL_ENVIRONMENT: demonstration
      VIGIL_TARGET_HOST: postgres
      VIGIL_TARGET_PORT: 5432
      VIGIL_TARGET_DATABASE: vigil_lab
      VIGIL_TARGET_SSL_MODE: verify-full
      VIGIL_TARGET_USER: vigil_reader
      VIGIL_PG_PASSWORD: synthetic-demo-reader
      VIGIL_DEMO_SELECT: SELECT id, total FROM lab_orders WHERE customer_id = 42 AND status = 'OPEN' ORDER BY created_at DESC LIMIT 20
      VIGIL_FINGERPRINT_KEY: vigil-compose-demo-fingerprint-key
    volumes:
      - vigil-sqlite:/var/lib/vigil

volumes:
  vigil-sqlite:
