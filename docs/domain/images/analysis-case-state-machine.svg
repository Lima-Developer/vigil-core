<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" role="img" aria-labelledby="title desc">
  <title id="title">Máquina de estados do AnalysisCase no Vigil</title>
  <desc id="desc">Em verde, transições implementadas no agregado Java. Em cinza tracejado, evolução arquitetural documentada e ainda não implementada.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcfe}.title{font:700 28px Arial,sans-serif;fill:#14213d}.sub{font:15px Arial,sans-serif;fill:#52657a}.node{fill:#fff;stroke:#2e9d76;stroke-width:2}.future{fill:#f8fafc;stroke:#8998a8;stroke-width:2;stroke-dasharray:8 6}.terminal{fill:#f1f6f3;stroke:#2e9d76;stroke-width:2}.label{font:700 14px Arial,sans-serif;fill:#17253a;text-anchor:middle}.small{font:12px Arial,sans-serif;fill:#52657a;text-anchor:middle}.line{stroke:#2e9d76;stroke-width:3;fill:none}.futureline{stroke:#8998a8;stroke-width:2.5;stroke-dasharray:8 6;fill:none}.caption{font:13px Arial,sans-serif;fill:#34465b}
    </style>
    <marker id="arrowLive" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e9d76"/></marker>
    <marker id="arrowFuture" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8998a8"/></marker>
  </defs>
  <rect class="bg" width="1440" height="690" rx="20"/>
  <text x="60" y="58" class="title">Ciclo de vida do AnalysisCase</text>
  <text x="60" y="85" class="sub">Verde contínuo: implementado e testado no agregado Java. Cinza tracejado: fluxo arquitetural previsto, ainda não executável no MVP.</text>

  <rect x="75" y="190" width="175" height="76" rx="14" class="node"/><text x="162" y="220" class="label">DISCOVERED</text><text x="162" y="242" class="small">caso aberto</text>
  <rect x="330" y="190" width="175" height="76" rx="14" class="node"/><text x="417" y="220" class="label">TRIAGED</text><text x="417" y="242" class="small">motivo auditável</text>
  <rect x="585" y="190" width="190" height="76" rx="14" class="node"/><text x="680" y="220" class="label">EVIDENCE_COLLECTED</text><text x="680" y="242" class="small">evidência vinculada</text>
  <path d="M250 228 H330" class="line" marker-end="url(#arrowLive)"/><text x="290" y="210" class="small">triage</text>
  <path d="M505 228 H585" class="line" marker-end="url(#arrowLive)"/><text x="545" y="210" class="small">collectEvidence</text>

  <rect x="845" y="190" width="160" height="76" rx="14" class="future"/><text x="925" y="220" class="label">SANITIZED</text><text x="925" y="242" class="small">contexto permitido</text>
  <rect x="1085" y="190" width="160" height="76" rx="14" class="future"/><text x="1165" y="220" class="label">DIAGNOSED</text><text x="1165" y="242" class="small">diagnóstico</text>
  <path d="M775 228 H845" class="futureline" marker-end="url(#arrowFuture)"/><path d="M1005 228 H1085" class="futureline" marker-end="url(#arrowFuture)"/>

  <rect x="168" y="410" width="195" height="76" rx="14" class="future"/><text x="265" y="440" class="label">HYPOTHESIS_PROPOSED</text><text x="265" y="462" class="small">hipótese testável</text>
  <rect x="443" y="410" width="160" height="76" rx="14" class="future"/><text x="523" y="440" class="label">VALIDATING</text><text x="523" y="462" class="small">sandbox isolado</text>
  <rect x="683" y="385" width="145" height="54" rx="12" class="future"/><text x="755" y="417" class="label">VALIDATED</text>
  <rect x="683" y="455" width="145" height="54" rx="12" class="future"/><text x="755" y="487" class="label">INVALIDATED</text>
  <rect x="683" y="525" width="145" height="54" rx="12" class="future"/><text x="755" y="557" class="label">INCONCLUSIVE</text>
  <rect x="908" y="410" width="185" height="76" rx="14" class="future"/><text x="1000" y="440" class="label">AWAITING_HUMAN</text><text x="1000" y="462" class="small">curadoria humana</text>
  <rect x="1175" y="385" width="120" height="54" rx="12" class="terminal"/><text x="1235" y="417" class="label">APPROVED</text>
  <rect x="1175" y="455" width="120" height="54" rx="12" class="terminal"/><text x="1235" y="487" class="label">REJECTED</text>
  <rect x="1175" y="525" width="120" height="54" rx="12" class="future"/><text x="1235" y="550" class="label">CHANGES</text><text x="1235" y="567" class="label">REQUESTED</text>
  <path d="M1165 266 C1165 330 265 330 265 410" class="futureline" marker-end="url(#arrowFuture)"/>
  <path d="M363 448 H443" class="futureline" marker-end="url(#arrowFuture)"/>
  <path d="M603 448 H650 V412 H683 M603 448 H650 V482 H683 M603 448 H650 V552 H683" class="futureline" marker-end="url(#arrowFuture)"/>
  <path d="M828 412 H908 M828 482 H870 V448 H908 M828 552 H870 V448 H908" class="futureline" marker-end="url(#arrowFuture)"/>
  <path d="M1093 448 H1140 V412 H1175 M1093 448 H1140 V482 H1175 M1093 448 H1140 V552 H1175" class="futureline" marker-end="url(#arrowFuture)"/>

  <line x1="60" y1="635" x2="90" y2="635" class="line"/><text x="100" y="640" class="caption">Implementado no agregado AnalysisCase: três estados, comandos nomeados, histórico de transição e eventos de domínio.</text>
  <line x1="60" y1="665" x2="90" y2="665" class="futureline"/><text x="100" y="670" class="caption">Previsto no documento arquitetural: sanitização, diagnóstico, hipótese, validação e decisão humana.</text>
</svg>
